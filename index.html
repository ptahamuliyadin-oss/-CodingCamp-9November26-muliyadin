<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Expense &amp; Budget Visualizer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Sora:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="balance">
    <p class="balance-label">Total Balance</p>
    <p class="balance-amount" id="balance" aria-live="polite">Rp0</p>
  </header>

  <main class="layout">
    <section class="panel" aria-labelledby="form-title">
      <h2 id="form-title">Add transaction</h2>
      <form id="expense-form" novalidate>
        <div class="field">
          <label for="item-name">Item name</label>
          <input type="text" id="item-name" name="name" autocomplete="off" placeholder="e.g. Lunch at the canteen">
          <p class="error" id="name-error" role="alert"></p>
        </div>
        <div class="field">
          <label for="item-amount">Amount</label>
          <input type="number" id="item-amount" name="amount" min="0" step="any" inputmode="decimal" placeholder="e.g. 25000">
          <p class="error" id="amount-error" role="alert"></p>
        </div>
        <div class="field">
          <label for="item-category">Category</label>
          <select id="item-category" name="category">
            <option value="">Choose a category</option>
            <option value="Food">Food</option>
            <option value="Transport">Transport</option>
            <option value="Fun">Fun</option>
          </select>
          <p class="error" id="category-error" role="alert"></p>
        </div>
        <button type="submit" class="btn-primary">Add transaction</button>
      </form>
    </section>

    <section class="panel chart-panel" aria-labelledby="chart-title">
      <h2 id="chart-title">Spending by category</h2>
      <div class="chart-wrap">
        <canvas id="spending-chart" aria-label="Pie chart of spending by category" role="img"></canvas>
        <p class="empty" id="chart-empty">Add a transaction to see where your money goes.</p>
      </div>
    </section>

    <section class="panel list-panel" aria-labelledby="list-title">
      <h2 id="list-title">Transactions</h2>
      <ul class="tx-list" id="tx-list"></ul>
      <p class="empty" id="list-empty">No transactions yet. Add your first one using the form.</p>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
